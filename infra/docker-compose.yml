# ==============================================================================
# NOTE: This file is an OPTIONAL local fallback.
# The primary architecture uses Supabase (Postgres & Storage) and Upstash (Redis)
# to eliminate local Docker dependency.
# ==============================================================================
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Uncomment once services/api has a Dockerfile
  # api:
  #   build: ../services/api
  #   env_file: .env
  #   ports: ["8000:8000"]
  #   depends_on: [postgres, redis, minio]
  # worker:
  #   build: ../services/api
  #   command: celery -A app.workers.celery_app worker -l info
  #   env_file: .env
  # beat:
  #   build: ../services/api
  #   command: celery -A app.workers.celery_app beat -l info
  #   env_file: .env

volumes:
  pgdata:
  miniodata:
