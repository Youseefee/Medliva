# ==============================================================================
# NOTE: This file is an OPTIONAL local fallback ONLY.
# The primary architecture uses Supabase (Postgres & Storage) and Upstash
# (Redis) and does not need Docker at all. Do not treat this compose file
# as a runnable copy of the production stack: there is no API service in
# it, because services/api has no Dockerfile and no celery worker code.
# It only provides local postgres / redis / minio for development.
# ==============================================================================
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # No api/worker/beat services: they were previously listed here as
  # commented-out blocks pointing at a Dockerfile and a celery app
  # (app.workers.celery_app) that do not exist in this repository.
  # Re-add them only together with a real Dockerfile and worker code.

volumes:
  pgdata:
  miniodata:
