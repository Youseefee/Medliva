name: CI
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Release APK
        run: flutter build apk --release
      - name: Rename APK for easy download
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Medliva-v1.0.0.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medliva-Android-APK
          path: apps/mobile/build/app/outputs/flutter-apk/Medliva-v1.0.0.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Releases (latest)
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Medliva Android APK ({0})', github.ref_name) || 'Medliva Android APK (Latest Release)' }}
          body: |
            ### 📱 Medliva Android Application (MVP Release v1.0.0)

            - **Direct APK Download:** Download `Medliva-v1.0.0.apk` below and install it directly on your Android device.
            - **Download Link:** https://github.com/Youseefee/Medliva/releases/download/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0-latest' }}/Medliva-v1.0.0.apk
            - **Commit:** `${{ github.sha }}`
            - **Channel:** Flutter Stable
            - **Signed:** Release APK signed for instant testing & installation.
          files: apps/mobile/build/app/outputs/flutter-apk/Medliva-v1.0.0.apk
          prerelease: false
          make_latest: true
